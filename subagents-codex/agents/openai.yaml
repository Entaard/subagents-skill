interface:
  display_name: "Subagent orchestration"
  short_description: "Plan-gated, cost-aware subagent orchestration for complicated tasks"

policy:
  # Implicit (automatic) skill activation is intentionally ON: activating this
  # skill on a complex task only produces a plan and a question (manual mode),
  # never surprise token spend. If it triggers too eagerly in practice, set
  # this to false — explicit "$subagents" invocation keeps working.
  allow_implicit_invocation: true
